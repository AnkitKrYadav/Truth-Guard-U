services:
  - type: web
    name: truth-guard-backend
    env: python
    region: oregon
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: FACTCHECK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
